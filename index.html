<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids na MAV</title>
<meta name="theme-color" content="#FAFCFF">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Kids na MAV">
<meta name="description" content="Check-in e check-out das crianças do Kids na MAV.">
<meta property="og:title" content="Kids na MAV">
<meta property="og:description" content="Check-in e check-out das crianças, de forma rápida e segura.">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#1F6FEB;--blue-d:#1554BF;--blue-l:#EAF2FF;
  --green:#22B573;--green-l:#E6F8EF;
  --yellow:#FFC20E;--yellow-l:#FFF5DC;
  --coral:#F7931E;--coral-l:#FFF0E0;
  --red:#E5484D;--red-l:#FDECEC;
  --text:#1B2A4A;--muted:#7A8AA6;--line:#E3EAF5;
  --bg:#EEF3FB;--card:#FFFFFF;--app:#FAFCFF;--ink:#141414;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.phone{width:100%;max-width:560px;height:100vh;height:100dvh;margin:0 auto;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:561px){.phone{box-shadow:0 0 50px rgba(27,42,74,.08)}}
.screen{flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column}
.screen.anim{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{width:36px;height:36px;border:none;background:var(--blue-l);color:var(--blue);border-radius:12px;font-size:20px;cursor:pointer;flex:none}
h1{font-size:20px;font-weight:800}
h2{font-size:16px;font-weight:800;margin:18px 0 8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.center{text-align:center}
.logo-sm{height:44px;display:block}
.home-top{text-align:center;padding:48px 0 6px}
.home-top img{width:min(320px,86%);display:block;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-weight:800;cursor:pointer;transition:.15s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-l)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red{background:#fff;border-color:var(--red);color:var(--red)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack>*+*{margin-top:10px}
.link{background:none;border:none;color:var(--blue);font-weight:700;cursor:pointer;padding:8px;font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label .req{color:var(--coral)}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
textarea.inp{min-height:70px;resize:vertical}
.radios{display:flex;gap:16px}.radios label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(27,42,74,.04)}
.row{display:flex;align-items:center;gap:12px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.item:hover{border-color:var(--blue)}
.item.static{cursor:default}.item.static:hover{border-color:var(--line)}
.item.sel{border-color:var(--blue);background:var(--blue-l)}
.item .t{font-weight:800;font-size:15px}.item .s{font-size:13px;color:var(--muted)}
.item .chev{margin-left:auto;color:var(--muted);font-size:20px}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.lg{width:92px;height:92px;font-size:50px}
.av.xs{width:28px;height:28px;font-size:16px}
.av.tap{cursor:pointer}
.av.tap::after{content:'📷';position:absolute;right:-2px;bottom:-2px;font-size:12px;background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.av.lg.tap::after{font-size:16px;width:30px;height:30px}
.photo-pick{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;width:100%;text-align:left;margin-top:12px}
.photo-pick .ph{width:56px;height:56px;border-radius:50%;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}
.photo-pick .ph img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-l);color:#138A55}.b-yellow{background:var(--yellow-l);color:#9A6A00}
.b-blue{background:var(--blue-l);color:var(--blue)}.b-red{background:var(--red-l);color:var(--red)}.b-coral{background:var(--coral-l);color:#C46A00}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:14px}
.sel .chk{background:var(--blue);border-color:var(--blue)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.sel .radio{border-color:var(--blue)}.sel .radio::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:20px}
.tick{width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;font-size:54px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px var(--green-l);margin:20px 0 26px;animation:pop .4s ease}
.tick.wait{background:var(--yellow);box-shadow:0 0 0 14px var(--yellow-l);animation:pulse 1.6s ease-in-out infinite}
.tick.no{background:var(--red);box-shadow:0 0 0 14px var(--red-l)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.success h1{color:var(--green);font-size:24px}
.label{border-radius:20px;padding:18px;color:var(--text);background:#fff;position:relative;overflow:hidden;border:1px solid var(--line)}
.label .dots{position:absolute;border-radius:50%;opacity:.85}
.label .inner{position:relative;text-align:center}
.label .name{font-family:'Baloo 2';font-weight:800;font-size:34px;color:var(--blue);letter-spacing:1px;line-height:1;margin-top:10px}
.label .code{font-family:'Baloo 2';font-weight:800;font-size:38px}
.tabs{display:flex;gap:4px;background:var(--blue-l);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font-weight:800;font-size:12.5px;color:var(--blue);cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{border-radius:14px;padding:12px 4px;text-align:center;color:#fff}
.stat b{font-size:26px;font-weight:800;display:block;line-height:1.1}.stat span{font-size:11px;font-weight:700}
.shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.sc:hover{border-color:var(--blue)}.sc .i{font-size:28px;display:block;margin-bottom:6px}
.urgent{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:16px;padding:14px;background:var(--yellow);color:var(--text);font-weight:800;font-size:15px;cursor:pointer;text-align:left;margin-top:10px;animation:pulse 2s ease-in-out infinite}
.urgent.coral{background:var(--coral);color:#fff}
.urgent .chev{margin-left:auto;font-size:22px}
.nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:none;background:none;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button .i{font-size:20px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--blue)}.nav button.on .i{filter:none;opacity:1}
.nav .cnt{position:absolute;top:0;left:55%;background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.alert{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--red-l);color:var(--red);font-weight:700;font-size:14px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;margin-top:12px}
.banner b{display:block;margin-bottom:2px}.banner span{font-size:13px}
.banner.yellow{background:var(--yellow-l);color:#7A5400}.banner.red{background:var(--red-l);color:var(--red)}.banner.blue{background:var(--blue-l);color:var(--blue-d)}
.warn{color:var(--red);font-size:13px;font-weight:700}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:20;max-width:90%;text-align:center;animation:in .2s}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.msg{background:#fff;border:1.5px solid var(--blue);border-radius:16px;padding:12px 14px}
.msg.nova{background:var(--blue-l);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
.msg .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.msg .h b{color:var(--text)}
.msg p{font-size:15px;font-weight:700;margin:8px 0 2px;white-space:pre-wrap}
.tpl{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
.tpl:hover{border-color:var(--blue)}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--yellow-l);border:1.5px dashed #F2CF6E;border-radius:12px;padding:8px 12px;margin-top:8px}
.codebox b{font-family:'Baloo 2';font-size:26px;letter-spacing:4px;line-height:1}
.codebox span{font-size:12px;color:#7A5400;font-weight:700}
.freq{font-size:13px;color:var(--muted);margin-top:4px}
.freq.off{color:#B4540A;font-weight:800}
.danger{border:1.5px solid #F5B5B7;background:var(--red-l);border-radius:14px;padding:12px;margin-top:8px}
.danger b{color:var(--red)}
.hint{background:var(--yellow-l);color:#7A5400;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.icon-btn{border:none;background:none;cursor:pointer;font-size:16px;padding:6px}
.mt{margin-top:auto;padding-top:18px}
.time-row{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--muted);font-weight:700}
.time-row b{color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.cfg{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cfg .i{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--blue-l);display:flex;align-items:center;justify-content:center}
.cfg .t{font-weight:800}.cfg .s{font-size:12px;color:var(--muted)}
.kid{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kid .acts{display:flex;gap:8px;margin-top:10px}
.bigcode{font-family:'Baloo 2';font-weight:800;font-size:64px;letter-spacing:8px;color:var(--blue);line-height:1}
.dotsload{display:inline-flex;gap:5px;margin-left:4px}.dotsload i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite}
.dotsload i:nth-child(2){animation-delay:.2s}.dotsload i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.scan-ov{position:absolute;inset:0;background:rgba(27,42,74,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.scan-box{background:#fff;border-radius:20px;padding:16px;width:100%}
#reader{width:100%;min-height:260px;border-radius:12px;overflow:hidden;background:#000}
.steps{font-size:14px;color:var(--muted)}
.steps li{list-style:none;display:flex;gap:12px;margin-top:14px}
.steps li .n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--blue-l);color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.steps b{color:var(--text)}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:12px;padding:12px}
.note .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.note .h b{color:var(--text)}
.note p{font-size:14px;white-space:pre-wrap}
.aviso{border-radius:14px;padding:12px 14px;background:var(--yellow-l);border:1px solid #FBE3A6}
.aviso b{display:block}.aviso p{font-size:14px;margin-top:4px;white-space:pre-wrap}
.aviso small{display:block;color:#9A6A00;font-size:12px;margin-top:6px;font-weight:700}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.cal-h b{font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{aspect-ratio:1;border:none;border-radius:12px;background:none;font-weight:700;color:#B5C0D3;position:relative;font-size:14px}
.cal-d.culto{background:#fff;border:1.5px solid var(--line);color:var(--text);cursor:pointer}
.cal-d.culto:hover{border-color:var(--blue)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--yellow)}
.cal-d.ok{background:var(--blue-l);border-color:#C9DCFF}
.cal-d.falta{background:var(--yellow-l);border-color:#F2CF6E}
.cal-d.me{background:var(--green-l);border-color:#9FDDBF;color:#138A55}
.cal-d.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cal-d small{position:absolute;bottom:3px;left:0;right:0;font-size:9px;font-weight:800;line-height:1}
.legend{display:flex;gap:12px;font-size:12px;color:var(--text);margin-top:12px;flex-wrap:wrap;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border:1.5px solid}
.cal-tip{font-size:12px;color:var(--muted);margin-top:8px}
.falta-txt{font-size:13px;font-weight:700;color:#9A6A00}
.area{border-top:1px solid var(--line);padding:10px 0}
.area:first-of-type{border-top:none}
.area-h{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase}
.pchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 4px;margin:0 6px 6px 0;font-size:13px;font-weight:700;background:var(--blue-l)}
.pchip.ok{background:var(--green-l);color:#138A55}.pchip.pend{background:var(--yellow-l);color:#7A5400}
.pchip button{border:none;background:none;cursor:pointer;font-size:13px;padding:0 4px;color:inherit;font-weight:800}

.pickup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0 4px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.pcard .av{margin:0 auto 8px}
.pcard b{display:block;font-size:15px;line-height:1.2}
.pcard span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pcard .badge{margin-top:6px}
.pick-li .pair{display:flex;align-items:center}
.pick-li .pair .av:last-child{margin-left:-12px;border:2px solid #fff;box-sizing:content-box}
.addrow{display:flex;gap:6px;margin-top:4px}.addrow select{flex:1;min-width:0;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px}
@media print{
  body{background:#fff}
  .phone{box-shadow:none;width:auto;height:auto;max-width:none}
  .screen>*:not(.print-area){display:none!important}
  .nav,.toast{display:none!important}
  .print-area .label{break-inside:avoid;margin-bottom:12px;width:90mm}
}
</style>
</head>
<body>
<div class="phone" id="phone"><div id="app" class="screen"></div></div>

<script>
/* =========================================================
   CONFIGURAÇÃO
   Cole aqui a URL do Web App do Apps Script (termina em /exec),
   ou cole dentro do app (líder) em Mais › Google Planilhas.
   Vazio = modo demonstração (dados ficam só neste navegador).
   ========================================================= */
const CONFIG = { APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxsgQ-_6WWesOpIm54DlxC2KJ3-UZb7LA743cED3kO6ChRfbiDHzNCz_tcYwteyhylv/exec' };
/* Na prévia do claude.ai a janela de confirmação é bloqueada: confirma direto. */

/* ---------- utilidades ---------- */
const mem = {};

  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ?? null) }catch(e){ return mem[k] ?? null } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const onlyDigits = s => String(s||'').replace(/\D/g,'');
const fmtTel = s => { const d=onlyDigits(s); return d.length>=10 ? `(${d.slice(0,2)}) ${d.slice(2,d.length-4)}-${d.slice(-4)}` : esc(s) };
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '--:--';
const isToday = iso => iso && new Date(iso).toDateString()===new Date().toDateString();
const quando = iso => { if(!iso) return ''; return isToday(iso) ? 'hoje, '+hhmm(iso) : new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+', '+hhmm(iso) };
const age = nasc => { if(!nasc) return ''; const b=new Date(nasc+'T12:00'), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a };
const first = n => esc(String(n||'').trim().split(' ')[0]);
const short = n => esc(String(n||'').trim().split(' ').slice(0,2).join(' '));
const isGirl = n => { const f=String(n||'').trim().split(' ')[0]; return /^tia$/i.test(f) || (/a$|e$/i.test(f) && !/^(jos[eé]|felipe|henrique|andr[eé]|guilherme|jorge|dante|vicente)$/i.test(f)) };
const bornYearsAgo = y => { const d=new Date(); d.setFullYear(d.getFullYear()-y); d.setMonth(d.getMonth()-2); return d.toISOString().slice(0,10) };
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromYmd = s => new Date(s+'T12:00');
const today = () => ymd(new Date());
const dataLonga = s => fromYmd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
const dataCurta = s => fromYmd(s).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});

async function hash(p){
  const txt = 'mavkids:' + p;
  if (window.crypto?.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=5381; for(const c of txt) h=((h<<5)+h+c.charCodeAt(0))|0; return 'x'+(h>>>0).toString(16);
}

/* ---------- cultos e calendário ---------- */
const cultosDoDia = s => db.cultos.filter(k=>+k.dia===fromYmd(s).getDay());
function proximosCultos(n, desde=today()){
  const out=[]; const d=fromYmd(desde);
  for(let i=0;i<500 && out.length<n;i++){ const s=ymd(d); cultosDoDia(s).forEach(k=>out.push({data:s,k})); d.setDate(d.getDate()+1) }
  return out;
}
function cultoAgora(){
  if(!db.cultos.length) return {data:today(),k:{id:'',nome:'Culto',hora:'',dia:''}};
  const hoje=cultosDoDia(today());
  if(hoje.length){ const h=new Date().getHours()*60+new Date().getMinutes(); const k=hoje.find(k=>{const [hh,mm]=k.hora.split(':');return h<=(+hh)*60+(+mm)+150})||hoje[hoje.length-1]; return {data:today(),k} }
  return proximosCultos(1)[0];
}

/* ---------- camada de dados (local + Apps Script) ---------- */
let pendingWrites = 0;
/* Com a planilha conectada, cada pedido leva a "chave" da pessoa logada.
   A planilha confere a chave e só devolve/aceita o que essa pessoa pode ver/fazer. */
const TABELAS = ['equipe','responsaveis','criancas','autorizados','cultos','checkins','notas','avisos','mensagens','escala','fotos'];
const dbVazio = () => Object.fromEntries([['version',DB_VERSION],...TABELAS.map(t=>[t,[]])]);
async function remote(payload, isWrite){
  const url = apiUrl(); if(!url) return null;
  if(sess?.token && !payload.token) payload={...payload, token:sess.token};
  if(isWrite) pendingWrites++;
  try{
    const r = await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j = await r.json();
    if(j && j.auth===false && sess){ sessaoExpirou(); return null }
    if(j && j.ok===false && j.error && isWrite) toast(j.error);
    return j;
  }catch(e){ console.warn('Falha ao sincronizar',e); if(isWrite) toast('Sem conexão com a planilha'); return null }
  finally{ if(isWrite) pendingWrites-- }
}
function sessaoExpirou(){ sess=null; store.set('mavkids_sess',null); db=dbVazio(); persist(); S.hist=[]; S.screen='home'; render(true); toast('Sua sessão terminou. Entre de novo.') }
async function sync(payload){ const r=await remote(payload,true); if(r && r.ok===false && !demo()) await loadRemote(true).then(ok=>ok&&onData()); return r }
function upsert(table, rec){
  const list = db[table]; const i = list.findIndex(x=>x.id===rec.id);
  if(i>=0) list[i] = {...list[i], ...rec}; else list.push(rec);
  const saved = i>=0 ? list[i] : rec;
  persist(); sync({action:'upsert', table, record: saved});
  return saved;
}
/* Grava e espera a planilha confirmar (usado quando o passo seguinte depende disso). */
async function upsertWait(table, rec){ upsertLocal(table, rec); if(demo()) return true; const r=await remote({action:'upsert',table,record:rec},true); return !!(r&&r.ok) }
function upsertLocal(table, rec){ const list=db[table]; const i=list.findIndex(x=>x.id===rec.id); if(i>=0) list[i]={...list[i],...rec}; else list.push(rec); persist() }
function removeRec(table, id){
  db[table] = db[table].filter(x=>x.id!==id); persist(); sync({action:'delete', table, id});
}
async function loadRemote(silent){
  if(!sess?.token) return false;
  const data = await remote({action:'getAll'});
  if(!data || !data.ok || pendingWrites) return false;
  const fotos = db.fotos||[];
  TABELAS.forEach(k=>{ db[k] = Array.isArray(data.data[k]) ? data.data[k] : (k==='fotos'?fotos:[]) });
  persist();
  if(!silent) toast('Dados carregados da planilha');
  return true;
}
async function loadFotos(){ if(!sess?.token) return; const r=await remote({action:'getFotos'}); if(r?.ok){ db.fotos=r.data; persist(); onData() } }

    rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(img.width,img.height), N=200; const c=document.createElement('canvas'); c.width=c.height=N;

}

async function saveAuth(){
  const a={id:uid(),nome:val('aNome'),parentesco:val('aPar'),telefone:onlyDigits(val('aTel')),respId:sess.id,acesso:''};
  if(!a.nome||!a.parentesco) return toast('Informe nome e parentesco');
  const acesso=document.getElementById('aAcesso')?.checked;
  if(acesso&&!waOk(a.telefone)) return toast('Para ter acesso ao app, informe o WhatsApp com DDD');
  const foto=S.tmpFoto; await upsertWait('autorizados',a); if(foto) setFoto(a.id,foto); S.tmpFoto=''; S.showAdd=false;
  if(acesso) darAcesso(a.id); else render();
}
const telEmUso = (tel, exceto) => db.responsaveis.some(r=>onlyDigits(r.telefone)===tel) || db.autorizados.some(x=>x.id!==exceto&&x.acesso==='sim'&&onlyDigits(x.telefone)===tel) || db.equipe.some(e=>onlyDigits(e.telefone)===tel);
async function darAcesso(aid){
  const a=db.autorizados.find(x=>x.id===aid); const tel=onlyDigits(a.telefone);
  if(!waOk(tel)) return toast('Cadastre o WhatsApp dessa pessoa primeiro');
  if(telEmUso(tel,aid)) return toast('Esse WhatsApp já é usado em outro login do app');
  const senha=String(1000+Math.floor(Math.random()*9000)); const novo={...a,acesso:'sim',senhaHash:await hash(senha),trocarSenha:'sim'};
  if(!demo()){ const r=await remote({action:'upsert',table:'autorizados',record:novo},true); if(!r||!r.ok){ await loadRemote(true); return render() } }
  upsertLocal('autorizados',novo);
  S.acessoNovo={id:aid,senha}; toast('Acesso liberado'); render();
}
function tirarAcesso(aid){ const a=db.autorizados.find(x=>x.id===aid); upsert('autorizados',{...a,acesso:'',senhaHash:'',trocarSenha:''}); S.acessoNovo=null; toast(`${a.nome.split(' ')[0]} continua podendo buscar, mas sem acesso ao app`); render() }
function acessoCard(a){ const txt=`Olá, ${a.nome.split(' ')[0]}! ${me().nome.split(' ')[0]} te autorizou a fazer o check-in das crianças no Kids na MAV. Entre no app com o seu WhatsApp (${onlyDigits(a.telefone)}) e a senha provisória ${S.acessoNovo.senha}. No primeiro acesso você cria a sua senha.`;
  return `<div class="banner" style="background:var(--green-l);color:#138A55">✅<div><b>Senha provisória de ${first(a.nome)}: ${S.acessoNovo.senha}</b><span>Login: o WhatsApp ${onlyDigits(a.telefone)}. No primeiro acesso, o app pede para criar a própria senha.</span></div></div>
  <a class="btn green sm" style="margin-top:8px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${onlyDigits(a.telefone)}?text=${encodeURIComponent(txt)}">💬 Enviar para ${first(a.nome)} pelo WhatsApp</a>` }

/* Aprovações */
V.aprovar = () => { const p=pend(); const tabs=[['checkins','Check-in',p.checkins.length],['familias','Famílias',p.familias.length],['criancas','Crianças',p.criancas.length]]; if(isAdmin()) tabs.push(['equipe','Equipe',p.equipe.length]); tabs.push(['senhas','Senhas',p.senhas.length]);
  if(!tabs.some(t=>t[0]===S.apTab)) S.apTab='checkins';
  const two = (no,yes,yesTxt='Aprovar') => `<div class="row" style="margin-top:12px"><button class="btn red sm" onclick="${no}">Recusar</button><button class="btn green sm" onclick="${yes}">${yesTxt}</button></div>`;
  let body='';
  if(S.apTab==='checkins') body = p.checkins.map(h=>{const c=child(h.criancaId), r=resp(c.respId); return `<div class="card"><div class="row">${av(c,0,1)}<div><div style="font-weight:800;font-size:17px">${esc(c.nome)}</div><div style="font-size:13px;color:var(--muted)">${kidLine(c)} • ${esc(culto(h.cultoId).nome)}<br>Trazido por ${esc(h.trazidoPor||r.nome+' ('+r.parentesco+')')}<br>pedido às ${hhmm(h.solicitadoEm)}</div></div></div>${alertHTML(c)}${two(`decideCheckin('${h.id}',false)`,`decideCheckin('${h.id}',true)`,'✓ Confirmar entrada')}<button class="link" style="padding:8px 0 0" onclick="abrirMsg('${c.id}')">💬 Mensagem durante o culto</button></div>`}).join('') || '<div class="empty">Nenhum check-in aguardando. 🙌</div>';
  if(S.apTab==='familias') body = p.familias.map(r=>`<div class="card"><div class="row">${av(r,1)}<div><div style="font-weight:800">${esc(r.nome)}</div><div style="font-size:13px;color:var(--muted)">${esc(r.parentesco)} • ${fmtTel(r.telefone)}<br>Emergência: ${esc(r.emergNome)} • ${fmtTel(r.emergTel)}</div></div></div>
    <div style="font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px">CRIANÇAS</div>
    <div class="stack">${kidsOf(r.id).map(c=>`<div class="row" style="gap:10px">${av(c)}<div><div style="font-weight:700">${esc(c.nome)}</div><div style="font-size:12px;color:var(--muted)">${kidLine(c)}${c.alergia?` • <span class="warn">Alergia: ${esc(c.alergia)}</span>`:''}</div></div></div>`).join('')||'<div style="font-size:13px;color:var(--muted)">Nenhuma criança cadastrada ainda.</div>'}</div>
    ${authOf(r.id).length?`<div style="font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px">RESPONSÁVEIS AUTORIZADOS</div><div style="font-size:13px">${authOf(r.id).map(a=>`${esc(a.nome)} (${esc(a.parentesco)})`).join(', ')}</div>`:''}
    ${two(`decideFamilia('${r.id}',false)`,`decideFamilia('${r.id}',true)`,'Aprovar família')}</div>`).join('') || '<div class="empty">Nenhuma família aguardando.</div>';
  if(S.apTab==='criancas') body = p.criancas.map(c=>{const r=resp(c.respId);return `<div class="card"><div class="row">${av(c)}<div><div style="font-weight:800">${esc(c.nome)}</div><div style="font-size:13px;color:var(--muted)">${kidLine(c)}<br>Responsável: ${esc(r.nome)}</div></div></div>${alertHTML(c)}${two(`decideCrianca('${c.id}',false)`,`decideCrianca('${c.id}',true)`)}</div>`}).join('') || '<div class="empty">Nenhuma criança aguardando.</div>';
  if(S.apTab==='equipe') body = p.equipe.map(e=>`<div class="card"><div class="row">${av(e,1)}<div><div style="font-weight:800">${esc(e.nome)}</div><div style="font-size:13px;color:var(--muted)">Turma: ${esc(e.turma)}<br>${fmtTel(e.telefone)}${e.email?' • '+esc(e.email):''}</div></div></div><label>Função (você escolhe)</label>${funSel('fun_'+e.id,e.funcao)}${two(`decideEquipe('${e.id}',false)`,`decideEquipe('${e.id}',true)`)}</div>`).join('') || '<div class="empty">Nenhum pedido da equipe.</div>';
  if(S.apTab==='senhas') body = (S.tempSenha?`<div class="card" style="border-color:var(--green);background:var(--green-l)"><div style="font-weight:800;color:#138A55">✅ Senha provisória de ${esc(S.tempSenha.nome)}</div>
      <div class="bigcode" style="font-size:44px;margin:8px 0;color:var(--text)">${S.tempSenha.senha}</div>
      <div style="font-size:13px;color:var(--muted)">Passe essa senha para a pessoa. No primeiro acesso, o app pede para criar uma nova.</div>
      <a class="btn green sm" style="margin-top:10px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${S.tempSenha.tel}?text=${encodeURIComponent('Olá! Sua senha provisória do Kids na MAV é '+S.tempSenha.senha+'. Entre no app com ela e crie uma senha nova.')}">💬 Enviar pelo WhatsApp</a>
      <button class="link" onclick="S.tempSenha=null;render()">Fechar</button></div>`:'') +
    (p.senhas.map(({tb,u})=>`<div class="card"><div class="row">${av(u,1)}<div><div style="font-weight:800">${esc(u.nome)}</div><div style="font-size:13px;color:var(--muted)">${tb==='equipe'?'Equipe':'Responsável'} • ${fmtTel(u.telefone)}<br>pediu nova senha ${quando(u.resetPedido)}</div></div></div>
      <div class="banner yellow" style="margin-top:10px">☎️<div><b>Confirme que é a pessoa</b><span>Fale com ela pessoalmente ou ligue para o número do cadastro antes de gerar a senha.</span></div></div>
      <div class="row" style="margin-top:12px"><button class="btn red sm" onclick="upsert('${tb}',{...db['${tb}'].find(x=>x.id==='${u.id}'),resetPedido:''});render()">Ignorar</button><button class="btn green sm" onclick="gerarSenha('${tb}','${u.id}')">Gerar senha provisória</button></div></div>`).join('') || (S.tempSenha?'':'<div class="empty">Nenhum pedido de senha.</div>'));
  return `<div class="top"><h1>Check-in e aprovações</h1></div>
  <div class="tabs">${tabs.map(([k,t,n])=>`<button class="${S.apTab===k?'on':''}" onclick="S.apTab='${k}';render()">${t}${n?` (${n})`:''}</button>`).join('')}</div>
  <div class="stack">${body}</div>`};
async function gerarSenha(tb,id){
  const u=db[tb].find(x=>x.id===id); const nova=String(1000+Math.floor(Math.random()*9000));
  upsert(tb,{...u,senhaHash:await hash(nova),trocarSenha:'sim',resetPedido:''});
  S.tempSenha={nome:u.nome,tel:onlyDigits(u.telefone),senha:nova}; render();
}
function decideCheckin(id,ok){ const h=ck(id); if(!h||h.status!=='solicitado') return render();
  upsert('checkins', ok ? {...h,status:'ativo',entrada:nowISO(),aprovadoPor:nomeEquipe(me())} : {...h,status:'recusado',aprovadoPor:nomeEquipe(me())});
  toast(ok?`Entrada de ${child(h.criancaId).nome.split(' ')[0]} confirmada`:'Check-in recusado'); render() }
function decideFamilia(rid,ok){ const r=resp(rid); upsert('responsaveis',{...r,status:ok?'aprovado':'recusado',aprovadoPor:nomeEquipe(me())});
  kidsOf(rid).filter(c=>c.status==='pendente').forEach(c=>upsert('criancas',{...c,status:ok?'aprovado':'recusado'}));
  toast(ok?'Família aprovada':'Cadastro recusado'); render() }
function decideCrianca(id,ok){ upsert('criancas',{...child(id),status:ok?'aprovado':'recusado'}); toast(ok?'Criança aprovada':'Cadastro recusado'); render() }
function decideEquipe(id,ok){ if(!isAdmin()) return; const f=document.getElementById('fun_'+id)?.value||staff(id).funcao; if(ok&&!f) return toast('Escolha a função: professor(a), auxiliar ou líder'); upsert('equipe',{...staff(id),funcao:f,admin:f==='Líder'?'sim':'',status:ok?'aprovado':'recusado'}); toast(ok?(f==='Líder'?'Acesso de líder liberado':'Acesso liberado'):'Pedido recusado'); render() }

/* Retiradas (lado da equipe) */
V.retiradas = () => { const p=pend(); return `
  <div class="top"><h1>Check-out</h1></div>
  <h2 style="margin-top:6px">Solicitadas pelo app</h2>
  <div class="stack">${p.ret.map(h=>{const c=child(h.criancaId); const q=quemBusca(h)||{nome:h.retiradaPor}; return `<button class="item pick-li" onclick="openEntrega('${h.id}','')"><span class="pair">${av(c)}${av(q,1)}</span><div><div class="t">${esc(c.nome)}</div><div class="s">Sala ${esc(c.turma)} • vai buscar: <b style="color:var(--text)">${esc(h.retiradaPor)}</b>${q.par?' ('+esc(q.par)+')':''}<br>pedido às ${hhmm(h.retiradaSolicitadaEm)}</div></div><span class="badge b-coral" style="margin-left:auto">Preparar</span></button>`}).join('')||'<div class="empty" style="padding:16px">Nenhuma retirada solicitada.</div>'}</div>
  <h2>Retirada sem pedido no app</h2>
  <div class="card">
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Digite ou escaneie o código do comprovante / celular de quem veio buscar.</div>
    <div class="row"><input class="inp" id="codeQ" inputmode="numeric" maxlength="4" placeholder="Código (4 dígitos)" onkeydown="if(event.key==='Enter')findByCode(val('codeQ'))"><button class="back" style="width:48px;height:48px" onclick="scanQR(findByCode)" aria-label="Escanear">📷</button></div>
    <button class="btn" style="margin-top:10px" onclick="findByCode(val('codeQ'))">Buscar</button>
  </div>
  <button class="link" style="margin-top:8px" onclick="tab('presentes')">Sem código? Buscar pela lista de presentes ›</button>`};
const quemBusca = h => { const ps=people(h); return ps.find(p=>p.nome===h.retiradaPor) || null };
function findByCode(txt){ const code=onlyDigits(txt).slice(-4); const h=present().find(x=>x.senha===code); if(!h) return toast('Nenhuma criança presente com esse código'); openEntrega(h.id, code) }
function openEntrega(hid, code){ const h=ck(hid); S.ent=hid; S.entCode=code||''; S.entDoc=false; S.entBy=(people(h).find(p=>p.nome===h.retiradaPor)||people(h)[0]).id; go('entrega') }
V.entrega = () => { const h=ck(S.ent); const c=child(h.criancaId); const ps=people(h); const p=ps.find(x=>x.id===S.entBy)||ps[0]; const codeOk=S.entCode===h.senha; return `
  ${header('Check-out', 'Confira a criança, a pessoa e o código antes de entregar.')}
  <div class="pickup">
    <div class="pcard">${av(c,0,1)}<b>${esc(c.nome)}</b><span>${kidLine(c)}</span><span class="badge b-blue">Sala ${esc(c.turma)}</span></div>
    <div style="font-size:26px;color:var(--muted)">➜</div>
    <div class="pcard">${av(p,1,1)}<b>${esc(p.nome)}</b><span>${esc(p.par)} • ${fmtTel(p.tel)}</span><span class="badge ${p.nome===h.retiradaPor?'b-coral':'b-green'}">${p.nome===h.retiradaPor?'Indicado pela família':esc(p.tipo)}</span></div>
  </div>
  ${alertHTML(c)}
  <button class="link" style="padding:6px 0" onclick="abrirMsg('${c.id}')">💬 Mensagem durante o culto</button>
  <h2>1. Código de retirada</h2>
  ${codeOk?`<div class="banner" style="background:var(--green-l);color:#138A55;margin-top:0">✅<div><b>Código ${h.senha} confere</b><span>Agora confira se a pessoa é a mesma da foto.</span></div></div>`:
  `<div class="row"><input class="inp" id="entCode" inputmode="numeric" maxlength="4" placeholder="Digite o código (4 dígitos)" value="${esc(S.entCode)}" oninput="S.entCode=onlyDigits(this.value);if(S.entCode.length===4){render();if(S.entCode!==ck(S.ent).senha)toast('Código não confere')}"><button class="back" style="width:48px;height:48px;flex:none" onclick="scanQR(t=>{S.entCode=onlyDigits(t).slice(-4);render();if(S.entCode!==ck(S.ent).senha)toast('Código não confere')})" aria-label="Escanear QR">📷</button></div>
   <div style="font-size:12px;color:var(--muted);margin-top:6px">Peça o código ou o QR que aparece no celular de quem veio buscar (ou no comprovante).</div>
   <label class="row" style="gap:8px;font-weight:600;margin-top:10px"><input type="checkbox" ${S.entDoc?'checked':''} onchange="S.entDoc=this.checked;render()"> Sem código: conferi documento com foto de ${first(p.nome)}</label>`}
  <h2>2. Quem está buscando?</h2>
  <div class="stack">${ps.map(x=>`<button class="item ${x.id===p.id?'sel':''}" onclick="S.entBy='${x.id}';render()"><span class="radio"></span>${av(x,1)}<div><div class="t">${esc(x.nome)}</div><div class="s">${esc(x.par)}${x.nome===h.retiradaPor?' • <b style="color:var(--coral)">indicado no app</b>':''}</div></div></button>`).join('')}</div>
  <div class="mt"><button class="btn green" ${codeOk||S.entDoc?'':'disabled'} onclick="doEntrega()">Confirmar entrega para ${first(p.nome)}</button></div>`};
function doEntrega(){
  const h=ck(S.ent); const p=people(h).find(x=>x.id===S.entBy)||people(h)[0];
  if(S.entCode!==h.senha && !S.entDoc) return toast('Código não confere');
  upsert('checkins',{...h,status:'finalizado',saida:nowISO(),retiradaPor:p.nome,entreguePor:nomeEquipe(me())+(S.entCode===h.senha?'':' (documento)')});
  S.coDone=h.id; S.hist=[]; go('okCheckout',true);
}

function enviarMsg(cid, texto){

async function mudarSenhaFam(rid){
  const pw=val('famPw'); if(!pw) return toast('Digite a nova senha');
  const troca=document.getElementById('famTroca').checked;
  upsert('responsaveis',{...resp(rid),senhaHash:await hash(pw),trocarSenha:troca?'sim':'',resetPedido:''});
  S.famPw=pw; S.famPwTroca=troca; toast('Senha alterada'); render();
}
function apagarCrianca(cid){
  db.checkins.filter(x=>x.criancaId===cid).forEach(x=>removeRec('checkins',x.id));
  db.notas.filter(x=>x.criancaId===cid).forEach(x=>removeRec('notas',x.id));
  (db.mensagens||[]).filter(x=>x.criancaId===cid).forEach(x=>removeRec('mensagens',x.id));
  if(fotoOf(cid)) removeRec('fotos',cid);
  removeRec('criancas',cid);
}
function excluir(tipo,id){
  if(!isAdmin()) return;
  if(tipo==='crianca'){ const n=child(id)?.nome; apagarCrianca(id); toast(`${n} excluído(a)`) }
  if(tipo==='autorizado'){ removeRec('autorizados',id); if(fotoOf(id)) removeRec('fotos',id); toast('Responsável autorizado excluído') }
  if(tipo==='familia'){ kidsOf(id).forEach(c=>apagarCrianca(c.id)); authOf(id).forEach(a=>{ removeRec('autorizados',a.id); if(fotoOf(a.id)) removeRec('fotos',a.id) });
    (db.mensagens||[]).filter(m=>m.respId===id).forEach(m=>removeRec('mensagens',m.id)); if(fotoOf(id)) removeRec('fotos',id);
    removeRec('responsaveis',id); S.confDel=null; toast('Família excluída'); back(); return }
  S.confDel=null; render();
}

/* Escala de voluntários com calendário 2026–2027 */
const MINY=2026, MAXY=2027;
function calMove(d){ let {y,m}=S.cal; m+=d; if(m<0){m=11;y--} if(m>11){m=0;y++} if(y<MINY||y>MAXY) return; S.cal={y,m}; S.calDay=null; render() }
function openDia(s){ S.calDay=s; S.cal={y:+s.slice(0,4), m:+s.slice(5,7)-1}; go('escala') }
V.escala = () => { const u=me(); const {y,m}=S.cal; const dim=new Date(y,m+1,0).getDate(); const off=new Date(y,m,1).getDay(); const hoje=today();
  let cells=['D','S','T','Q','Q','S','S'].map(d=>`<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(off);
  for(let d=1; d<=dim; d++){ const s=ymd(new Date(y,m,d)); const ks=cultosDoDia(s); const es=db.escala.filter(e=>e.data===s); const mine=es.some(e=>e.equipeId===u.id);
    const completa = ks.length && ks.every(k=>AREAS.every(a=>es.some(e=>e.cultoId===k.id&&e.area===a)));
    let cls='', tag='';
    if(ks.length){ if(mine){cls='me';tag='Você'} else if(completa){cls='ok'} else if(isAdmin() && s>=hoje){cls='falta';tag='Falta'} }
    cells+=`<button class="cal-d ${ks.length?'culto':''} ${cls} ${s===S.calDay?'on':''} ${s===hoje?'today':''}" ${ks.length?`onclick="S.calDay='${s}';render()"`:'disabled'}>${d}${tag?`<small>${tag}</small>`:''}</button>` }
  const minhas=db.escala.filter(e=>e.equipeId===u.id&&e.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,4);
  return `
  ${header('Escala de voluntários', isAdmin()?'Escale as tias em cada sala. A escala define a quais salas cada tia tem acesso no culto.':'Veja quando você serve e confirme sua presença.')}
  ${!isAdmin()&&minhas.length?`<h2 style="margin-top:4px">Minhas próximas escalas</h2><div class="stack">${minhas.map(e=>`<div class="item static"><span style="font-size:24px">📅</span><div><div class="t">${dataCurta(e.data)} • ${esc(culto(e.cultoId).nome)}</div><div class="s">${esc(e.area)}</div></div>${e.status==='Confirmado'?'<span class="badge b-green" style="margin-left:auto">Confirmado</span>':`<button class="btn green sm" style="margin-left:auto;width:auto" onclick="setEsc('${e.id}','Confirmado')">Confirmar</button>`}</div>`).join('')}</div>`:''}
  <div class="card" style="margin-top:12px">
    <div class="cal-h"><button class="back" onclick="calMove(-1)" ${y===MINY&&m===0?'disabled style="opacity:.3"':''} aria-label="Mês anterior">‹</button><b>${new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="back" onclick="calMove(1)" ${y===MAXY&&m===11?'disabled style="opacity:.3"':''} aria-label="Próximo mês">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">${isAdmin()?`<span><i style="background:var(--blue-l);border-color:#C9DCFF"></i>Escala completa</span><span><i style="background:var(--yellow-l);border-color:#F2CF6E"></i>Falta escalar</span>`:`<span><i style="background:var(--blue-l);border-color:#C9DCFF"></i>Escala pronta</span>`}<span><i style="background:var(--green-l);border-color:#9FDDBF"></i>Você serve</span></div>
    <div class="cal-tip">Quintas e domingos são os dias de culto: toque em um deles para ${isAdmin()?'montar a escala':'ver quem serve'}.</div>
  </div>
  ${S.calDay?dayDetail(S.calDay):'<div class="empty" style="padding:18px">Selecione um dia de culto no calendário.</div>'}`};
function dayDetail(s){
  const u=me(); const ativos=db.equipe.filter(e=>e.status==='aprovado');
  return `<h2 style="text-transform:capitalize">${dataLonga(s)}</h2><div class="stack" style="padding-bottom:10px">${cultosDoDia(s).map(k=>`<div class="card"><div style="font-weight:800;margin-bottom:6px">⛪ ${esc(k.nome)} • ${esc(k.hora)}</div>
    ${AREAS.map((a,ai)=>{ const es=db.escala.filter(e=>e.data===s&&e.cultoId===k.id&&e.area===a); const livres=ativos.filter(x=>!es.some(e=>e.equipeId===x.id));
      return `<div class="area"><div class="area-h">${a}</div>
      ${es.map(e=>{const p=staff(e.equipeId); if(!p) return ''; const mine=p.id===u.id; return `<span class="pchip ${e.status==='Confirmado'?'ok':'pend'}">${av(p,1,'xs')}${short(p.nome)} ${e.status==='Confirmado'?'✓':'•'}${mine&&e.status!=='Confirmado'?`<button onclick="setEsc('${e.id}','Confirmado')">Confirmar</button>`:''}${isAdmin()?`<button onclick="removeRec('escala','${e.id}');render()" aria-label="Remover">✕</button>`:''}</span>`}).join('')||(isAdmin()?'<span class="falta-txt">⚠️ Falta escalar</span>':'<span style="font-size:13px;color:var(--muted)">Ninguém escalado</span>')}
      ${isAdmin()?`<div class="addrow"><select id="es_${k.id}_${ai}"><option value="">＋ Escalar alguém...</option>${livres.map(x=>`<option value="${x.id}">${esc(x.nome)} — ${esc(x.funcao)}</option>`).join('')}</select><button class="btn sm" style="width:auto" onclick="addEsc('${s}','${k.id}',${ai})">Adicionar</button></div>`:''}</div>` }).join('')}</div>`).join('')}</div>`;
}
function addEsc(s,k,ai){ const v=document.getElementById(`es_${k}_${ai}`)?.value; if(!v) return toast('Escolha uma pessoa'); upsert('escala',{id:uid(),data:s,cultoId:k,area:AREAS[ai],equipeId:v,status:'Pendente'}); toast('Pessoa escalada'); render() }
function setEsc(id,st){ upsert('escala',{...db.escala.find(e=>e.id===id),status:st}); toast('Presença confirmada. Obrigada! 💛'); render() }

    <label>Mensagem</label><textarea class="inp" id="wTxt" placeholder="Escreva o aviso..."></textarea>
    <label>Quem vai ver?</label><select class="inp" id="wPub"><option value="responsaveis">Responsáveis pelas crianças</option><option value="equipe">Equipe (tias)</option><option value="todos">Todos</option></select>
    <button class="btn" style="margin-top:12px" onclick="addAviso()">📢 Publicar aviso</button></div>`:''}
  <div class="stack" style="margin-top:14px;padding-bottom:10px">${list.map(a=>`<div>${avisoHTML(a)}${isAdmin()?`<button class="link" style="color:var(--red);padding:4px 2px" onclick="if(confirm('Apagar este aviso?')){removeRec('avisos','${a.id}');render()}">Apagar</button>`:''}</div>`).join('')||'<div class="empty">Nenhum aviso publicado.</div>'}</div>`};
function addAviso(){ const t=val('wTit'), x=val('wTxt'); if(!t||!x) return toast('Preencha título e mensagem'); upsert('avisos',{id:uid(),titulo:t,texto:x,publico:val('wPub'),autorNome:nomeEquipe(me()),criadoEm:nowISO()}); document.getElementById('wTit').value=''; document.getElementById('wTxt').value=''; toast('Aviso publicado'); render() }

V.equipeLista = () => `
  ${header('Equipe', isAdmin()?'Gerencie quem tem acesso à área da equipe.':'Pessoas da equipe do ministério.')}
  <div class="stack" style="padding-bottom:10px">${db.equipe.filter(e=>isAdmin()||e.status==='aprovado').map(e=>`<div class="item static">${av(e,1,0,e.id===sess.id)}<div style="flex:1"><div class="t">${esc(e.nome)}${e.admin==='sim'?' <span class="badge b-blue">Líder</span>':''}</div><div class="s">${esc(e.admin==='sim'?'Líder':(e.funcao||'Sem função'))} • ${esc(e.turma)}${e.telefone?' • '+fmtTel(e.telefone):''}</div>${isAdmin()&&e.admin!=='sim'&&e.status==='aprovado'?`<select style="margin-top:6px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;background:#fff" onchange="upsert('equipe',{...staff('${e.id}'),funcao:this.value,admin:this.value==='Líder'?'sim':''});toast(this.value==='Líder'?'Agora é líder':'Função atualizada');render()">${FUNCOES_APROV.map(f=>`<option ${f===e.funcao?'selected':''}>${f}</option>`).join('')}</select>`:''}
    ${isAdmin()&&e.id!==sess.id&&e.status==='aprovado'?`<button class="link" style="padding:4px 0" onclick="upsert('equipe',{...staff('${e.id}'),admin:'${e.admin==='sim'?'':'sim'}',funcao:'${e.admin==='sim'?'Professor(a)':'Líder'}'});render()">${e.admin==='sim'?'Remover líder':'Tornar líder'}</button> · <button class="link" style="padding:4px 0;color:var(--red)" onclick="if(confirm('Bloquear o acesso de ${first(e.nome)}?')){upsert('equipe',{...staff('${e.id}'),status:'recusado'});render()}">Bloquear</button>`:''}
    ${isAdmin()&&e.status!=='aprovado'?`<button class="link" style="padding:4px 0;color:var(--green)" onclick="decideEquipe('${e.id}',true)">Liberar acesso</button>`:''}</div>
    ${isAdmin()?`<span class="badge ${e.status==='aprovado'?'b-green':e.status==='pendente'?'b-yellow':'b-red'}">${e.status==='aprovado'?'Ativo':e.status==='pendente'?'Pendente':'Bloqueado'}</span>`:''}</div>`).join('')}</div>`;

V.config = () => { const u=me(); return `
  <div class="top"><h1>Mais</h1></div>
  <div class="card row" style="margin:8px 0 6px">${av(u,1,0,1)}<div style="flex:1"><div style="font-weight:800">${esc(u.nome)}</div><div style="font-size:13px;color:var(--muted)">${esc(u.admin==='sim'?'Líder':u.funcao)} • ${fmtTel(u.telefone)}</div></div><button class="link" onclick="logout()">Sair</button></div>
  ${[['📢','Avisos',isAdmin()?'Publicar para equipe e responsáveis':'Recados da liderança',"go('avisos')"],['📅','Escala de voluntários',isAdmin()?'Montar a escala de cada culto':'Quem serve em cada culto',"go('escala')"],['👥','Equipe',isAdmin()?'Membros, administradores e acessos':'Pessoas da equipe',"go('equipeLista')"],...(isAdmin()?[['👨‍👩‍👧','Famílias','Logins, senhas e exclusões',"S.q='';go('familias')"]]:[]),['📆','Sem vir há 3 meses','Crianças afastadas',"go('ausentes')"]].map(([i,t,s,a])=>`<div class="cfg" onclick="${a}"><span class="i">${i}</span><div><div class="t">${t}</div><div class="s">${s}</div></div><span style="margin-left:auto;color:var(--muted)">›</span></div>`).join('')}
  ${isAdmin()&&!CONFIG.APPS_SCRIPT_URL?`<h2>Google Planilhas</h2>
  <details class="card"${apiUrl()?'':' open'}>
    <summary style="cursor:pointer;font-weight:800">${apiUrl()?'✅ Conectado à planilha':'⚙️ Configuração (feita uma vez só)'}</summary>
    <div style="font-size:13px;color:var(--muted);margin:8px 0">${apiUrl()?'Tudo o que acontece no app já é salvo na planilha sozinho. Não precisa fazer nada aqui.':'Hoje o app está em <b>modo de teste</b>: os dados ficam só neste celular. Para valer de verdade, cole aqui <b>uma única vez</b> o link do Apps Script (passo a passo no README). Depois disso tudo é salvo sozinho, para todo mundo.'}</div>
    <input class="inp" id="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(apiUrl())}">
    <button class="btn ghost sm" style="margin-top:10px" onclick="saveUrl()">Salvar link</button>
    ${apiUrl()?'':'<div class="help" style="margin-top:8px">Dica: quem publicar o app pode colocar esse link direto no arquivo, e aí esta caixa nem aparece.</div>'}
  </details>
  ${apiUrl()?'':'<button class="link" style="margin-top:12px;color:var(--red)" onclick="resetDemo()">Restaurar dados de teste</button>'}`:''}
  <div class="card row" style="margin:14px 0 20px;font-size:12px;color:var(--muted)"><span style="font-size:24px">🛡️</span><span><b style="color:var(--text)">Segurança e privacidade.</b> Dados e fotos usados exclusivamente para o cuidado e a segurança das crianças, em conformidade com a LGPD.</span></div>`};
async function saveUrl(){ store.set('mavkids_url',val('url')); toast(val('url')?'URL salva':'URL removida'); if(val('url')){ await loadRemote(); loadFotos() } render() }
async function pushAll(){ if(!apiUrl()) return toast('Salve a URL primeiro'); const r=await remote({action:'replaceAll',data:db},true); toast(r&&r.ok?'Planilha atualizada':'Não foi possível enviar') }
async function resetDemo(){ if(!confirm('Apagar dados locais e restaurar a demonstração?')) return; db=await seed(); persist(); store.set('mavkids_seen',{}); toast('Demonstração restaurada'); render() }

/* ---------- caixa de diálogo dentro do app ---------- */
function dialog(html){ closeDialog(); const ov=document.createElement('div'); ov.className='scan-ov'; ov.id='dlg'; ov.innerHTML=`<div class="scan-box">${html}</div>`; document.getElementById('phone').appendChild(ov) }
function closeDialog(){ document.getElementById('dlg')?.remove() }

/* ---------- leitor de QR (câmera, só para a equipe) ---------- */
const scripts={};
function loadScript(src){ return scripts[src] ||= new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s) }) }
function scanQR(cb){
  const phone=document.getElementById('phone'); const ov=document.createElement('div'); ov.className='scan-ov';
  ov.innerHTML='<div class="scan-box"><div style="font-weight:800;margin-bottom:10px">Aponte para o QR de quem veio buscar</div><div id="reader"></div><button class="btn ghost" style="margin-top:12px" id="scanClose">Fechar</button></div>';
  phone.appendChild(ov); let q=null, done=false;
  const close=()=>{ if(done) return; done=true; if(q) q.stop().catch(()=>{}).finally(()=>ov.remove()); else ov.remove() };
  document.getElementById('scanClose').onclick=close;
  loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js')
    .then(()=>{ q=new Html5Qrcode('reader'); return q.start({facingMode:'environment'},{fps:10,qrbox:200},txt=>{ close(); cb(txt) }) })
    .catch(()=>{ toast('Não foi possível abrir a câmera. Digite o código.'); close() });
}

/* ---------- render e atualização ao vivo ---------- */
const PUBLIC=['home','como','login','cadResp','staffLogin','staffCad','staffEnviado','esqueci','esqueciOk'];
const STAFF=['ausentes','familias','familia','mensagem','msgOk','dash','aprovar','presentes','retiradas','config','ficha','alertas','escala','entrega','equipeLista','avisos'];
function guard(){
  if(PUBLIC.includes(S.screen)) return;
  const u=me();
  if(!u){ sess=null; store.set('mavkids_sess',null); S.screen='home'; S.hist=[]; return }
  if(sess.tipo==='equipe' && u.status!=='aprovado'){ sess=null; store.set('mavkids_sess',null); S.screen='home'; S.hist=[]; return }
  if(sess.tipo==='resp' && sess.via && !vinc()){ sess=null; store.set('mavkids_sess',null); S.screen='home'; S.hist=[]; return }
  if(usuario().trocarSenha==='sim'){ S.screen='novaSenha'; return }
  if(sess.tipo==='resp' && sess.via && ['autorizados','cadCrianca'].includes(S.screen)) S.screen='pais';
  if(S.screen==='novaSenha'){ S.screen=homeScreen(); }
  if(sess.tipo==='resp' && STAFF.includes(S.screen)) S.screen='pais';
  if(sess.tipo==='equipe' && !STAFF.includes(S.screen) && !['comprovante','okCheckout'].includes(S.screen)) S.screen='dash';
  if(sess.tipo==='equipe' && ['familias','familia'].includes(S.screen) && !isAdmin()) S.screen='dash';
}
function render(anim){
  guard();
  const phone=document.getElementById('phone'); const app=document.getElementById('app');
  phone.querySelector('.nav')?.remove();
  const top=app.scrollTop;
  app.classList.toggle('anim',!!anim); if(anim){ void app.offsetWidth }
  app.innerHTML=(V[S.screen]||V.home)();
  if(!anim) app.scrollTop=top;
  if(sess?.tipo==='equipe' && NAV.some(n=>n[0]===S.screen)) phone.insertAdjacentHTML('beforeend', navBar(S.screen));
  app.querySelectorAll('.qr').forEach(el=>{ if(window.QRCode) new QRCode(el,{text:el.dataset.code,width:+el.dataset.size,height:+el.dataset.size,colorDark:'#1B2A4A'}) });
  const n = sess?.tipo==='equipe' ? pend().checkins.length + pend().ret.length : 0;
  document.title = n ? `(${n}) Kids na MAV` : 'Kids na MAV';
}

/* Telas que mudam sozinhas quando a outra ponta age */
function autoAdvance(){
  if(S.screen==='aguardando'){
    const hs=S.pend.map(ck).filter(Boolean);
    if(hs.length && hs.every(h=>h.status!=='solicitado')){
      const ok=hs.filter(h=>h.status!=='recusado'&&h.status!=='cancelado');
      S.hist=['pais']; S.tag=0;
      if(ok.length){ S.last=ok.map(h=>h.id); S.screen='okCheckin'; navigator.vibrate?.(150) } else S.screen='recusado';
      return true;
    }
  }
  if(S.screen==='codigoRetirada'){ const h=ck(S.ret); if(h&&h.status==='finalizado'){ S.coDone=h.id; S.hist=['pais']; S.screen='okCheckout'; navigator.vibrate?.(150); return true } if(h&&h.status==='ativo'){ S.hist=[]; S.screen='pais'; return true } }
  return false;
}
let lastMsgs=null;
function notifyResp(){
  if(sess?.tipo!=='resp') { lastMsgs=null; return }
  const n=msgsResp(sess.id).filter(m=>!m.lida).length;
  if(lastMsgs!==null && n>lastMsgs){ toast('💬 Nova mensagem da equipe'); navigator.vibrate?.([150,80,150]) }
  lastMsgs=n;
}
let lastAlert=null;
function notifyStaff(){
  if(sess?.tipo!=='equipe') return;
  const p=pend(); const n=p.checkins.length+p.ret.length;
  if(lastAlert!==null && n>lastAlert){ toast(p.checkins.length?'🔔 Novo check-in aguardando aprovação':'🚪 Nova retirada solicitada'); navigator.vibrate?.([100,60,100]) }
  lastAlert=n;
}
function onData(){
  const moved=autoAdvance(); notifyStaff(); notifyResp();
  const a=document.activeElement; const typing=a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName);
  const hasDraft=[...document.querySelectorAll('#app textarea,#app input:not([type=checkbox]):not([type=radio])')].some(x=>x.value);
  if(moved){ closeDialog(); render(true) } else if(!typing && !hasDraft && !document.querySelector('.scan-ov')) render(false);
}
window.addEventListener('storage', e=>{ if(e.key==='mavkids_db' && e.newValue){ try{ db=JSON.parse(e.newValue); onData() }catch(_){} } });
setInterval(async()=>{ if(!db || demo() || pendingWrites || !sess?.token) return; if(await loadRemote(true)) onData() }, 4000);
setInterval(()=>{ if(db && !demo() && sess?.token) loadFotos() }, 90000);

(async function init(){
  db = store.get('mavkids_db');
  if(!db || db.version!==DB_VERSION){
    if(apiUrl()) db=dbVazio();  /* planilha conectada: começa vazio e carrega dela */
    else db = await seed();
    persist() }
  if(apiUrl() && sess && !sess.token){ sess=null; store.set('mavkids_sess',null); db=dbVazio(); persist() }   /* sessão antiga, do modo de teste */
  if(apiUrl() && sess){ await loadRemote(true) }
  if(sess && !me()) { sess=null; store.set('mavkids_sess',null) }
  S.screen = homeScreen();
  render(true);
  if(apiUrl() && sess){ onData(); loadFotos() }
  lastAlert = sess?.tipo==='equipe' ? pend().checkins.length+pend().ret.length : null;
  lastMsgs = sess?.tipo==='resp' ? msgsResp(sess.id).filter(m=>!m.lida).length : null;
})();
</script>
